# docker-compose.yml — contenedor efímero del pipeline (construye desde el código).
#
# No deja un proceso corriendo: se lanza con `docker compose run --rm` y termina.
# Para el servidor (imagen ya publicada) usa docker-compose.server.yml.
services:
  whatsthenew:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: whatsthenew:local
    env_file:
      - ../.env
    environment:
      # El clon del repo privado es efímero y vive dentro del contenedor.
      PLAN_DIR: /tmp/whatsthenew-plan
      PLAN_FILE: /tmp/whatsthenew-plan/GOD_PLAN.md
      TMP_RAW: /tmp/whatsthenew_raw.json
      OUTPUT_FILE: /app/output/PROPOSED_UPDATES.md
      PROPOSED_PLAN_FILE: /app/output/GOD_PLAN.proposed.md
    volumes:
      # Solo la salida se conserva en el host (el plan ya no se monta: es privado).
      - ../output:/app/output
    # Sin `restart`: debe morir al terminar.
    restart: "no"
