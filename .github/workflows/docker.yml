name: Docker (GHCR)

# Construye la imagen del pipeline y la publica en GitHub Container Registry.
# El servidor solo hace `docker pull`: no compila nada.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - "opencode.jsonc"
      - ".opencode/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El servidor solo hace `docker pull`, así que el paquete debe ser público.
      # Best-effort: si el token del workflow no puede cambiarlo, no rompe el build.
      - name: Asegurar paquete público (best-effort)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          gh api -X PATCH "/user/packages/container/${{ github.event.repository.name }}" -f visibility=public
          gh api -X PATCH "/users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}" -f visibility=public
